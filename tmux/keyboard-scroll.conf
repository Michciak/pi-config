# Keyboard history only: no mouse, clipboard, terminal or keyboard-protocol options.
bind-key -n PageUp copy-mode -e \; send-keys -X halfpage-up
bind-key -T copy-mode PageUp send-keys -X halfpage-up
bind-key -T copy-mode-vi PageUp send-keys -X halfpage-up
bind-key -T copy-mode PageDown send-keys -X halfpage-down-and-cancel
bind-key -T copy-mode-vi PageDown send-keys -X halfpage-down-and-cancel
bind-key -T copy-mode Escape send-keys -X cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode q send-keys -X cancel
bind-key -T copy-mode-vi q send-keys -X cancel
