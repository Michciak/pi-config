# Pi/Warp: keep native Warp selection/copy enabled
# Let tmux receive the wheel and enter copy mode for scrollback. Warp still
# supports Cmd+C for a selection made in copy mode; keyboard scrolling remains
# available with Option+Up/Down below.
set -g mouse on
set -g xterm-keys on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g history-limit 20000
set -g mode-keys vi
set -s set-clipboard on

# Enter tmux copy mode with Ctrl-b [, then select with keyboard.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'

# Scroll five lines with Option+arrow keys. Keep the root bindings simple so
# they work both from Pi's prompt and after entering copy mode.
bind -n M-Up copy-mode -e \; send-keys -X scroll-up -N 5
bind -n M-Down copy-mode -e \; send-keys -X scroll-down -N 5
bind -T copy-mode-vi M-Up send-keys -X scroll-up -N 5
bind -T copy-mode-vi M-Down send-keys -X scroll-down -N 5

# Explicit wheel bindings keep scrolling inside tmux even when the foreground
# program is an interactive Pi prompt.
bind -n WheelUpPane if-shell -F '#{pane_in_mode}' 'send-keys -X scroll-up -N 5' 'copy-mode -e'
bind -T copy-mode-vi WheelUpPane send-keys -X scroll-up -N 5
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down -N 5
