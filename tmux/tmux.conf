# Pi + Warp: retain standard scrolling and use explicit clipboard shortcuts.
set -g mouse on
set -s copy-command 'pbcopy'
# Warp normally advertises xterm-256color; forward clickable OSC 8 file links.
set -as terminal-features ',xterm*:hyperlinks'
set -s extended-keys on
set -s extended-keys-format csi-u
# Explicit macOS clipboard selection, with either tmux copy-mode key table.
bind -T copy-mode v send-keys -X begin-selection
bind -T copy-mode y send-keys -X copy-pipe-and-cancel '/usr/bin/pbcopy'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '/usr/bin/pbcopy'
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '/usr/bin/pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '/usr/bin/pbcopy'
# Prefix+v pastes text; Ctrl+v remains available to Pi for images.
bind v run-shell '/bin/zsh "$HOME/.pi/agent/bin/tmux-paste.sh" #{q:socket_path} #{pane_id}'
# Keyboard scroll: Ctrl+b [, then PageUp/PageDown or arrows; q returns to Pi.
# Native selection: Shift+drag, Cmd+C. Paste: q out of copy-mode, then Cmd+V.
