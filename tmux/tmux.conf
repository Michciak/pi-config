# Pi/Warp: keep native Warp selection/copy enabled
set -g mouse off
set -g history-limit 20000
set -g mode-keys vi
set -s set-clipboard on

# Enter tmux copy mode with Ctrl-b [, then select with keyboard.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'

# Scroll five lines with Option+arrow keys.
bind -n M-Up if-shell -F '#{pane_in_mode}' 'send-keys -X scroll-up -N 5' 'copy-mode -e \; send-keys -X scroll-up -N 5'
bind -n M-Down if-shell -F '#{pane_in_mode}' 'send-keys -X scroll-down -N 5' 'copy-mode -e \; send-keys -X scroll-down -N 5'
bind -T copy-mode-vi M-Up send-keys -X scroll-up -N 5
bind -T copy-mode-vi M-Down send-keys -X scroll-down -N 5
