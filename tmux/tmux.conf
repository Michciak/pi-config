# Pi 0.87 / tmux 3.7 / Warp on macOS. See docs/warp-tmux.md.
# Enable both Mouse Reporting and Scroll Reporting in Warp.
set -g mouse on
set -g xterm-keys on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g history-limit 20000
set -g mode-keys vi
set -s set-clipboard external
set -s copy-command 'pbcopy'

# Remove the previous global Ctrl+V override on a running server.
# Pi owns Ctrl+V (including image paste); Cmd+V remains a Warp action.
unbind -q -n C-v
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# All send-keys flags MUST precede the copy-mode command.
# "send -X scroll-up -N 3" silently does nothing in tmux 3.7.
# First wheel event enters copy mode AND moves the viewport. Target the pane
# under the pointer, including subagents, rather than the last active pane.
bind -n WheelUpPane select-pane -t = \; if-shell -F -t = '#{pane_in_mode}' 'send-keys -t = -X -N 3 scroll-up' 'copy-mode -e -t =; send-keys -t = -X -N 3 scroll-up'
# Downward wheel at the live prompt must not become an arrow key.
bind -n WheelDownPane select-pane -t =
bind -T copy-mode-vi WheelUpPane select-pane -t = \; send-keys -t = -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane -t = \; send-keys -t = -X -N 3 scroll-down-and-cancel
bind -T copy-mode WheelUpPane select-pane -t = \; send-keys -t = -X -N 3 scroll-up
bind -T copy-mode WheelDownPane select-pane -t = \; send-keys -t = -X -N 3 scroll-down-and-cancel

# Keyboard alternatives; down at the live prompt is a no-op.
bind -n M-Up copy-mode -e \; send-keys -X -N 5 scroll-up
bind -n M-Down if-shell -F '#{pane_in_mode}' 'send-keys -X -N 5 scroll-down-and-cancel'
bind -T copy-mode-vi M-Up send-keys -X -N 5 scroll-up
bind -T copy-mode-vi M-Down send-keys -X -N 5 scroll-down-and-cancel
bind -T copy-mode M-Up send-keys -X -N 5 scroll-up
bind -T copy-mode M-Down send-keys -X -N 5 scroll-down-and-cancel

# Escape in stock vi copy mode only clears selection. Here it returns live.
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode Escape send-keys -X cancel
bind -T copy-mode q send-keys -X cancel

# Drag/release -> macOS clipboard + exit. copy-command also covers tmux's
# default double/triple-click and Copy menu actions.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -t = -X copy-pipe-and-cancel
bind -T copy-mode MouseDragEnd1Pane send-keys -t = -X copy-pipe-and-cancel
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode Enter send-keys -X copy-pipe-and-cancel

# Ctrl+b, Shift+p: exit copy mode and paste text with bracketed paste and
# preserved newlines. Explicit socket/pane prevent cross-pane pastes.
bind P run-shell 'python3 "${PI_CODING_AGENT_DIR:-$HOME/.pi/agent}/tmux/paste.py" #{q:socket_path} #{pane_id}'
# Recovery and reload do not restart Pi or send Escape to its prompt.
bind Escape if-shell -F '#{pane_in_mode}' 'send-keys -X cancel' \; refresh-client
bind r source-file ~/.tmux.conf \; display-message 'Pi/Warp config reloaded; Esc exits scroll mode; prefix P pastes'
